# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: fr-FR
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*"
      instructions: >-
        Read AGENTS.md, context/IA_WORKFLOW.md, docs/CONTRIBUTING.md and relevant
        linked guides. Prioritize behavior, security, accessibility, trip isolation,
        stale approvals and atomic room assignment. The current product contract
        is docs/PRODUCT_SPEC.md; docs/MISSION_ORIGINAL.md is historical.
