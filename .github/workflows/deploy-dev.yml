name: Deploy dev after CI

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check code and build
        run: pnpm check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vercel-dev
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_KIND: development
      DEPLOY_REF: dev
      DEPLOY_SHA: ${{ github.sha }}
      GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install Vercel CLI
        run: npm install --global vercel@65.8.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Link Vercel project
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Migrate the dev database
        run: vercel env run --environment=preview --git-branch=dev -- pnpm --filter @traveler/api db:migrate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy the tested dev commit
        id: deploy
        run: node .github/scripts/deploy-vercel-git-ref.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
