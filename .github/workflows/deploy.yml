name: Deploy reviewed main to Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: Preview or staged production (does not promote)
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production-staged

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.target == 'production-staged' && 'production' || 'vercel-preview' }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 65.2.0
      DEPLOY_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pinned tools
        run: npm install --global pnpm@11.25.0 "vercel@$VERCEL_CLI_VERSION"
      - name: Verify project configuration
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Pull deployment settings
        run: |
          if [ "$DEPLOY_TARGET" = production-staged ]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build deployment output
        run: |
          if [ "$DEPLOY_TARGET" = production-staged ]; then
            vercel build --prod
          else
            vercel build
          fi
      - name: Deploy without promoting production
        run: |
          if [ "$DEPLOY_TARGET" = production-staged ]; then
            vercel deploy --prebuilt --prod --skip-domain
          else
            vercel deploy --prebuilt
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
