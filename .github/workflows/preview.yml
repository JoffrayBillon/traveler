name: Create feature preview

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to test and deploy (codex/* or feature/*)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ inputs.source_branch }}
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          case "$SOURCE_BRANCH" in
            codex/*|feature/*) ;;
            *) echo "Choose a branch under codex/ or feature/." >&2; exit 1 ;;
          esac
          if [[ "$SOURCE_BRANCH" == *..* || "$SOURCE_BRANCH" == */ ]]; then
            echo "Branch name is not valid for a preview." >&2
            exit 1
          fi
          git check-ref-format --branch "$SOURCE_BRANCH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check branch
        run: pnpm check
      - name: Record tested commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: vercel-preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      DEPLOY_KIND: preview
      DEPLOY_REF: ${{ inputs.source_branch }}
      DEPLOY_SHA: ${{ needs.check.outputs.source_sha }}
      GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Deploy the tested feature commit
        id: deploy
        run: node .github/scripts/deploy-vercel-git-ref.mjs

